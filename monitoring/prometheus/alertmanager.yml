# Alertmanager. Alerts are grouped and shown in the Alertmanager UI (port 9093).
# To send them to Slack, replace the "default" receiver with the commented block
# and keep the webhook URL in a mounted file, never in this repository.
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]

receivers:
  - name: default
    # slack_configs:
