{{- /*
  Nexvion is a static site with no application secrets. The only Secret it can use is the optional
  basic-auth credential for staging, enforced by Nginx in the pods. It is created only when
  basicAuth.enabled=true AND a bcrypt htpasswd line is supplied at deploy time (never stored in Git):
    --set basicAuth.enabled=true --set-string basicAuth.htpasswd="$(htpasswd -nbB admin 'password')"
*/ -}}
{{- if and .Values.basicAuth.enabled .Values.basicAuth.htpasswd }}
apiVersion: v1
kind: Secret
metadata:
  name: nexvion-basic-auth
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth.conf: |
    auth_basic "Nexvion staging";
    auth_basic_user_file /etc/nginx/auth.d/htpasswd;
  htpasswd: {{ .Values.basicAuth.htpasswd | quote }}
{{- end }}
