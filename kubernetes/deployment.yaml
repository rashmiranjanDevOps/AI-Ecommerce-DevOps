apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-web
  namespace: nexvion
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/instance: nexvion
    app.kubernetes.io/part-of: nexvion
    color: blue
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  # Rolling update: add one new pod, remove an old one only when the new one is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ecommerce
      app.kubernetes.io/instance: nexvion
      color: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce
        app.kubernetes.io/instance: nexvion
        app.kubernetes.io/part-of: nexvion
        color: blue
    spec:
      serviceAccountName: nexvion-web
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ecommerce
      containers:
        - name: web
          image: nexvion-web:latest   # replaced by scripts/deploy.sh
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: auth, mountPath: /etc/nginx/auth.d, readOnly: true }
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
          ports:
            - name: metrics
              containerPort: 9113
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nexvion-nginx
        - name: auth
          secret:
            secretName: nexvion-basic-auth
            optional: true        # absent = no password (production)
