# Optional HTTP basic auth for staging environments, enforced by Nginx inside the pods.
# (An AWS ALB cannot do basic auth itself, so the pods do.) Production simply has no such Secret.
#
# Do NOT put a real password here. Create the real Secret from the command line:
#   scripts/deploy.sh k8s --image <img> --basic-auth admin:'S0me-Strong-Password'
# which runs the equivalent of:
#   htpasswd -nbB admin 'S0me-Strong-Password' > /tmp/htpasswd
#   kubectl -n nexvion create secret generic nexvion-basic-auth \
#     --from-file=htpasswd=/tmp/htpasswd \
#     --from-literal=auth.conf='auth_basic "Nexvion staging"; auth_basic_user_file /etc/nginx/auth.d/htpasswd;'
#
# This file is intentionally NOT listed in kustomization.yaml, so the placeholder is never applied.
apiVersion: v1
kind: Secret
metadata:
  name: nexvion-basic-auth
  namespace: nexvion
type: Opaque
stringData:
  auth.conf: |
    auth_basic "Nexvion staging";
    auth_basic_user_file /etc/nginx/auth.d/htpasswd;
  htpasswd: "admin:REPLACE_WITH_HTPASSWD_HASH"
