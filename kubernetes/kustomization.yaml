# kubectl apply -k kubernetes/      (or: scripts/deploy.sh k8s)
# secret.yaml is deliberately not listed: it only contains a placeholder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nexvion
resources:
  - namespace.yaml
  - rbac.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
