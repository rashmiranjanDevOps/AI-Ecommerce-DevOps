# Least privilege for CI/CD (Jenkins): a Role limited to the nexvion namespace, bound to the group
# "nexvion-deployers", which the EKS access entry created in Terraform maps to the Jenkins IAM role.
# Apply once as cluster admin, together with namespace.yaml:
#   kubectl apply -f kubernetes/namespace.yaml -f kubernetes/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexvion-deployer
  namespace: nexvion
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexvion-deployer
  namespace: nexvion
subjects:
  - kind: Group
    name: nexvion-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: nexvion-deployer
  apiGroup: rbac.authorization.k8s.io
