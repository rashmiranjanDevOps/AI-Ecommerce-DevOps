# GENERATED by scripts/sync-config.sh from docker/nginx/default.conf - do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexvion-nginx
  namespace: nexvion
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/part-of: nexvion
data:
  default.conf: |
    # Web container configuration (serves the static Nexvion site on 8080).
    
    # One JSON object per request so Filebeat/Logstash can index fields directly.
    log_format json_combined escape=json
      '{"time":"$time_iso8601","service":"nexvion-web","remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$http_x_forwarded_for","host":"$host","request_method":"$request_method",'
      '"request_uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,"http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';
    
    server {
        listen 8080;
        server_name _;
        server_tokens off;
    
        root  /usr/share/nginx/html;
        index index.html;
    
        # Optional HTTP basic auth for staging. A Kubernetes Secret (nexvion-basic-auth) mounted at
        # /etc/nginx/auth.d provides auth.conf + htpasswd. Without the Secret this matches nothing.
        include /etc/nginx/auth.d/*.conf;
    
        access_log /dev/stdout json_combined;
        error_log  /dev/stderr warn;
    
        # Security headers. Inline script/style are allowed because the demo pages use them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://images.unsplash.com https://placehold.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    
        # Liveness/readiness and availability probes.
        location = /health {
            auth_basic off;
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nexvion-web"}';
        }
    
        # Nginx metrics for the Prometheus exporter (internal networks only).
        location = /nginx_status {
            auth_basic off;
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    
        location ~ /\. { deny all; }
    
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            try_files $uri =404;
        }
    
        location ~* \.html$ {
            expires -1;
            try_files $uri =404;
        }
    
        location / {
            try_files $uri $uri/ =404;
        }
    }
