# Scaling: needs metrics-server (installed by "scripts/deploy.sh addons").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexvion-web
  namespace: nexvion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexvion-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
