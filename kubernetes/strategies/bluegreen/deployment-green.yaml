# Green = the NEW version. It runs next to the live (blue) deployment but gets no live traffic
# until switch.sh flips the Service selector. Test it first through nexvion-web-green-preview.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-web-green
  namespace: nexvion
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/instance: nexvion
    app.kubernetes.io/part-of: nexvion
    color: green
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: ecommerce
      app.kubernetes.io/instance: nexvion
      color: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce
        app.kubernetes.io/instance: nexvion
        app.kubernetes.io/part-of: nexvion
        color: green
    spec:
      serviceAccountName: nexvion-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: nexvion-web:latest   # set to the NEW tag by switch.sh / deploy.sh
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: auth, mountPath: /etc/nginx/auth.d, readOnly: true }
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
          ports:
            - { name: metrics, containerPort: 9113 }
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, configMap: { name: nexvion-nginx } }
        - { name: auth, secret: { secretName: nexvion-basic-auth, optional: true } }
