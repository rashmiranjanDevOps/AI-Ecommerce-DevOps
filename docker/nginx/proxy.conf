# Reverse proxy in front of the web container: User -> proxy -> web.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

log_format json_proxy escape=json
  '{"time":"$time_iso8601","service":"nexvion-proxy","remote_addr":"$remote_addr",'
  '"host":"$host","request_method":"$request_method","request_uri":"$request_uri",'
  '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr","upstream_response_time":"$upstream_response_time",'
  '"http_user_agent":"$http_user_agent"}';

upstream nexvion_web {
    server web:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /dev/stdout json_proxy;
    error_log  /dev/stderr warn;

    # The proxy's own health endpoint (does not touch the web container).
    location = /proxy-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nexvion-proxy"}';
    }

    # Application health, passed through to the web container.
    location = /health {
        access_log off;
        proxy_pass http://nexvion_web;
    }

    # Internal metrics must not be reachable from outside.
    location = /nginx_status { return 404; }

    location / {
        limit_req zone=per_ip burst=40 nodelay;
        proxy_pass http://nexvion_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
