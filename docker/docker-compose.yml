# Nexvion local / single-server stack.
#   Core only      : docker compose up -d --build
#   + monitoring   : docker compose --profile monitoring up -d
#   + logging (ELK): docker compose --profile logging up -d
#   Everything     : docker compose --profile monitoring --profile logging up -d
name: nexvion

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ───────────── application ─────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${IMAGE_TAG:-latest}
    image: ${REGISTRY:-local}/nexvion-web:${IMAGE_TAG:-latest}
    container_name: nexvion-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [nexvion-net]
    logging: *default-logging

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: nexvion-proxy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:8080"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/proxy-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [nexvion-net]
    logging: *default-logging

  # ───────────── monitoring profile ─────────────
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    container_name: nexvion-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [nexvion-net]
    logging: *default-logging

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0
    container_name: nexvion-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [nexvion-net]
    logging: *default-logging

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.0
    container_name: nexvion-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in docker/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [nexvion-net]
    logging: *default-logging

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2
    container_name: nexvion-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [nexvion-net]
    logging: *default-logging

  cadvisor:
    profiles: [monitoring]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nexvion-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [nexvion-net]
    logging: *default-logging

  nginx-exporter:
    profiles: [monitoring]
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nexvion-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://web:8080/nginx_status
    depends_on:
      web:
        condition: service_healthy
    networks: [nexvion-net]
    logging: *default-logging

  blackbox:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.25.0
    container_name: nexvion-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ../monitoring/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [nexvion-net]
    logging: *default-logging

  # ───────────── logging (ELK) profile ─────────────
  elasticsearch:
    profiles: [logging]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: nexvion-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # lab setup: bound to localhost only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [nexvion-net]
    logging: *default-logging

  logstash:
    profiles: [logging]
    image: docker.elastic.co/logstash/logstash:8.15.2
    container_name: nexvion-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ../logging/elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../logging/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [nexvion-net]
    logging: *default-logging

  kibana:
    profiles: [logging]
    image: docker.elastic.co/kibana/kibana:8.15.2
    container_name: nexvion-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 5s
      retries: 30
    networks: [nexvion-net]
    logging: *default-logging

  filebeat:
    profiles: [logging]
    image: docker.elastic.co/beats/filebeat:8.15.2
    container_name: nexvion-filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ../logging/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log/host:ro
    depends_on: [logstash]
    networks: [nexvion-net]
    logging: *default-logging

  elk-setup:
    profiles: [logging]
    image: curlimages/curl:8.10.1
    container_name: nexvion-elk-setup
    restart: "no"
    entrypoint: ["sh", "/setup/setup-elk.sh"]
    environment:
      ES_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
    volumes:
      - ../logging/elk/setup-elk.sh:/setup/setup-elk.sh:ro
    depends_on:
      kibana:
        condition: service_healthy
    networks: [nexvion-net]

networks:
  nexvion-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  es-data:
