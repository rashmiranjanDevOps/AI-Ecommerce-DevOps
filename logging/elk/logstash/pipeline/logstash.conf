# Beats -> parse -> Elasticsearch
input {
  beats {
    port => 5044
  }
}

filter {
  # Nginx (web and proxy) writes one JSON object per request.
  if [message] =~ /^\s*\{.*\}\s*$/ {
    json {
      source => "message"
      target => "nginx"
      skip_on_invalid_json => true
    }
    if [nginx][time] {
      date {
        match  => ["[nginx][time]", "ISO8601"]
        target => "@timestamp"
      }
    }
    ruby {
      code => '
        st = event.get("[nginx][status]")
        event.set("[nginx][status_class]", "#{st.to_i / 100}xx") if st
      '
    }
    mutate { add_tag => ["nginx_json"] }
  }

  # Where does the event go? System logs get their own index.
  if [log_type] == "system" {
    mutate { add_field => { "[@metadata][index]" => "nexvion-system" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "nexvion-logs" } }
  }

  # Keep the document small.
  mutate { remove_field => ["agent", "ecs", "input", "log"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
