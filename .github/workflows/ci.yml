# GitHub Actions: basic CI (the alternative to Jenkins named in the project specification).
# Jenkins (jenkins/Jenkinsfile) is the main pipeline and also deploys; this one runs the same
# scripts so a pull request is checked even without Jenkins, and it can publish the image to ECR.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install lint tools
        run: cd jenkins/lint && npm install --no-audit --no-fund --loglevel=error
      - name: Lint
        run: npm --prefix jenkins/lint run lint
      - name: Python test dependencies
        run: python3 -m pip install pyyaml
      - name: Repository tests
        run: ./scripts/test.sh

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history for the secret scan
      - name: Install gitleaks and trivy
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Secret scan
        run: ./security/scan-secrets.sh
      - name: Dependency and configuration scan
        run: ./security/scan-dependencies.sh

  image:
    name: Build, scan and smoke-test the image
    runs-on: ubuntu-latest
    needs: [test, security]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: ./scripts/deploy.sh build --registry local --tag "${{ steps.vars.outputs.tag }}"
      - name: Install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Image scan
        run: ./security/scan-image.sh "local/nexvion-web:${{ steps.vars.outputs.tag }}" --sbom
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18080:8080 "local/nexvion-web:${{ steps.vars.outputs.tag }}"
          ./scripts/health-check.sh --url http://localhost:18080 --retries 10 --delay 3
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore

  publish:
    name: Push image to ECR
    runs-on: ubuntu-latest
    needs: image
    # Only on main, and only when the repository variables for AWS are configured.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != '' && vars.ECR_REGISTRY != ''
    permissions:
      contents: read
      id-token: write                 # OIDC: no AWS keys are stored in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          ./scripts/deploy.sh build --registry "${{ vars.ECR_REGISTRY }}" --tag "${{ needs.image.outputs.tag }}"
          docker push "${{ vars.ECR_REGISTRY }}/nexvion-web:${{ needs.image.outputs.tag }}"
